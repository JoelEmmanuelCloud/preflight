specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: DemoToken
    network: sepolia
    source:
      address: "0x4311FaE3BE9F813575299A983Eb6FE0F52438ffd"
      abi: DemoToken
      startBlock: 11652643
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Approval
        - Wallet
      abis:
        - name: DemoToken
          file: ./abis/DemoToken.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
      file: ./src/demo-token.ts
